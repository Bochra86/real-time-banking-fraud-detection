name: Real-Time Banking Fraud Detection CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Show environment
        run: |
          pwd
          ls -la
          python --version
          java -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify API import
        run: |
          python -c "from api.main import app; print('API IMPORT SUCCESS')"

      - name: Verify Spark import
        run: |
          python -c "from pyspark.sql import SparkSession; print('SPARK IMPORT SUCCESS')"

      - name: Lint code
        run: |
          flake8 .

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=80
